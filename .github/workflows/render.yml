name: Render Image

on:
  workflow_dispatch:
    inputs:
      background:
        required: true
        type: string

      logo:
        required: true
        type: string

      title:
        required: true
        type: string

      episode:
        required: true
        type: string

      channel:
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create input.json
        env:
          BACKGROUND: ${{ inputs.background }}
          LOGO: ${{ inputs.logo }}
          TITLE: ${{ inputs.title }}
          EPISODE: ${{ inputs.episode }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import json
          import os

          data = {
              "background": os.environ["BACKGROUND"],
              "logo": os.environ["LOGO"],
              "title": os.environ["TITLE"],
              "episode": os.environ["EPISODE"],
              "channel": os.environ["CHANNEL"]
          }

          with open("input.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Render image
        run: |
          python renderer.py input.json

      - name: Upload rendered image
        uses: actions/upload-artifact@v4
        with:
          name: rendered-image
          path: output/output.png
