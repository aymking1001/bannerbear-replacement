name: Render Image

on:
  workflow_dispatch:
    inputs:
      background:
        required: true
        type: string

      logo:
        required: true
        type: string

      title:
        required: true
        type: string

      episode:
        required: true
        type: string

      channel:
        required: true
        type: string

      webhook_url:
        required: true
        type: string

      cloudinary_cloud_name:
        required: true
        type: string

      cloudinary_api_key:
        required: true
        type: string

      cloudinary_api_secret:
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create input.json
        env:
          BACKGROUND: ${{ inputs.background }}
          LOGO: ${{ inputs.logo }}
          TITLE: ${{ inputs.title }}
          EPISODE: ${{ inputs.episode }}
          CHANNEL: ${{ inputs.channel }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          CLOUDINARY_CLOUD_NAME: ${{ inputs.cloudinary_cloud_name }}
          CLOUDINARY_API_KEY: ${{ inputs.cloudinary_api_key }}
          CLOUDINARY_API_SECRET: ${{ inputs.cloudinary_api_secret }}
        run: |
          python - <<'PY'
          import json
          import os

          data = {
              "background": os.environ["BACKGROUND"],
              "logo": os.environ["LOGO"],
              "title": os.environ["TITLE"],
              "episode": os.environ["EPISODE"],
              "channel": os.environ["CHANNEL"],
              "webhook_url": os.environ["WEBHOOK_URL"],
              "cloudinary_cloud_name": os.environ["CLOUDINARY_CLOUD_NAME"],
              "cloudinary_api_key": os.environ["CLOUDINARY_API_KEY"],
              "cloudinary_api_secret": os.environ["CLOUDINARY_API_SECRET"]
          }

          with open("input.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Render image
        run: |
          python renderer5.py input.json

      - name: Upload image to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ inputs.cloudinary_cloud_name }}
          CLOUDINARY_API_KEY: ${{ inputs.cloudinary_api_key }}
          CLOUDINARY_API_SECRET: ${{ inputs.cloudinary_api_secret }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          import requests

          cloud_name = os.environ["CLOUDINARY_CLOUD_NAME"]
          api_key = os.environ["CLOUDINARY_API_KEY"]
          api_secret = os.environ["CLOUDINARY_API_SECRET"]

          timestamp = int(time.time())

          signature_string = (
              f"timestamp={timestamp}{api_secret}"
          )

          signature = hashlib.sha1(
              signature_string.encode("utf-8")
          ).hexdigest()

          url = (
              f"https://api.cloudinary.com/v1_1/"
              f"{cloud_name}/image/upload"
          )

          with open("output/output.png", "rb") as image_file:
              response = requests.post(
                  url,
                  files={
                      "file": image_file
                  },
                  data={
                      "api_key": api_key,
                      "timestamp": timestamp,
                      "signature": signature
                  },
                  timeout=120
              )

          response.raise_for_status()

          result = response.json()

          secure_url = result["secure_url"]

          print("Cloudinary upload successful")
          print("Image URL:")
          print(secure_url)

          with open("cloudinary_url.txt", "w", encoding="utf-8") as f:
              f.write(secure_url)
          PY

      - name: Send secure_url to n8n
        env:
          WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          webhook_url = os.environ["WEBHOOK_URL"]

          with open("cloudinary_url.txt", "r", encoding="utf-8") as f:
              secure_url = f.read().strip()

          response = requests.post(
              webhook_url,
              json={
                  "secure_url": secure_url
              },
              timeout=30
          )

          response.raise_for_status()

          print("secure_url sent to n8n successfully")

          print(
              json.dumps(
                  {
                      "secure_url": secure_url
                  },
                  ensure_ascii=False
              )
          )
          PY
