name: Render Image

on:
  workflow_dispatch:
    inputs:
      background:
        required: true
        type: string

      logo:
        required: true
        type: string

      title:
        required: true
        type: string

      episode:
        required: true
        type: string

      channel:
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create input.json
        env:
          BACKGROUND: ${{ inputs.background }}
          LOGO: ${{ inputs.logo }}
          TITLE: ${{ inputs.title }}
          EPISODE: ${{ inputs.episode }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import json
          import os

          data = {
              "background": os.environ["BACKGROUND"],
              "logo": os.environ["LOGO"],
              "title": os.environ["TITLE"],
              "episode": os.environ["EPISODE"],
              "channel": os.environ["CHANNEL"]
          }

          with open("input.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Render image
        run: |
          python renderer.py input.json

      - name: Upload image to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          import requests

          cloud_name = os.environ["CLOUDINARY_CLOUD_NAME"]
          api_key = os.environ["CLOUDINARY_API_KEY"]
          api_secret = os.environ["CLOUDINARY_API_SECRET"]

          timestamp = int(time.time())

          signature_string = (
              f"timestamp={timestamp}{api_secret}"
          )

          signature = hashlib.sha1(
              signature_string.encode("utf-8")
          ).hexdigest()

          url = (
              f"https://api.cloudinary.com/v1_1/"
              f"{cloud_name}/image/upload"
          )

          with open("output/output.png", "rb") as image_file:
              response = requests.post(
                  url,
                  files={
                      "file": image_file
                  },
                  data={
                      "api_key": api_key,
                      "timestamp": timestamp,
                      "signature": signature
                  },
                  timeout=120
              )

          response.raise_for_status()

          result = response.json()

          print("Cloudinary upload successful")
          print("Image URL:")
          print(result["secure_url"])
          PY
